[env:base]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200

[env:blink]
extends = env:base
build_src_filter = +<scripts/blink.cpp>

[env:test_mic]
extends = env:base
build_src_filter = +<scripts/test_mic.cpp> +<sensors/>

[env:test_flex]
extends = env:base
build_src_filter = +<scripts/test_flex.cpp> +<sensors/>

[env:test_hall]
extends = env:base
build_src_filter = +<scripts/test_hall.cpp> +<sensors/>

[env:test_mqtt]
extends = env:base
build_src_filter = +<scripts/test_mqtt.cpp> +<comms/>
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson

[env:test_record_send]
extends = env:base
build_src_filter = +<scripts/test_record_send.cpp> +<sensors/> +<comms/audio_recorder.cpp>
