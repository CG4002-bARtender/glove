[env:base]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
build_src_filter = +<*> -<scripts/>
lib_deps =
  electroniccats/MPU6050
  eclipse/Paho
  bblanchon/ArduinoJson

[env:blink]
extends = env:base
build_src_filter = +<scripts/blink.cpp>

[env:test_imu]
extends = env:base
build_src_filter = +<scripts/test_imu.cpp> +<sensors/>

[env:test_flex]
extends = env:base
build_src_filter = +<scripts/test_flex.cpp> +<sensors/>

[env:test_mqtt]
extends = env:base
build_src_filter = +<scripts/test_mqtt.cpp> +<comms/>

[env:test_all]
extends = env:base
build_src_filter = +<scripts/test_all.cpp> +<comms/> +<sensors/>
